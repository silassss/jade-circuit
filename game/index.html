<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08282b">
  <title>Jade Circuit</title>
  <link rel="stylesheet" href="styles/frame.css">
  <link rel="stylesheet" href="styles/jade.css">
  <link rel="preload" as="image" href="assets/courier-running.webp" media="(prefers-reduced-motion: no-preference)">
  <script defer src="src/audio.js" data-music="tecnological_messup_v2_0"></script>
  <script defer src="src/board/board.js"></script>
  <script defer src="src/gear.js"></script>
  <script defer src="src/combat/run-upgrades.js"></script>
  <script defer src="src/combat/combat.js"></script>
  <script defer src="src/talents.js"></script>
  <script defer src="src/loadout.js"></script>
  <script defer src="src/session.js"></script>
  <script defer src="src/view/jade-view.js"></script>
  <script defer src="src/main.js"></script>
</head>
<body>
  <div class="game-frame run-frame">
    <main id="game" aria-label="Jade Circuit coin pusher"></main>
    <button class="jade-pause" type="button" aria-label="Pause run" aria-haspopup="dialog" aria-controls="pause-panel" disabled>
      <span aria-hidden="true"></span>
    </button>
    <dialog id="pause-panel" aria-labelledby="pause-title">
      <header><h2 id="pause-title">Run paused</h2></header>
      <div class="pause-actions">
        <button class="pause-resume" type="button" autofocus>Resume run</button>
        <button type="button" data-sound-toggle aria-label="Game sound" aria-pressed="true">Sound on</button>
        <button class="pause-restart" type="button">Restart run</button>
        <a href="home.html">Return to homepage</a>
      </div>
    </dialog>
    <div class="run-loading" role="status" aria-label="Entering Jade Circuit" hidden>
      <div class="coin-rain" aria-hidden="true">
        <i style="--x: 4%; --size: 8cqw; --delay: 0ms; --fall: 1.1s; --drift: 5cqw"></i>
        <i style="--x: 53%; --size: 10cqw; --delay: 40ms; --fall: 0.95s; --drift: -4cqw"></i>
        <i style="--x: 28%; --size: 6cqw; --delay: 75ms; --fall: 1.22s; --drift: 6cqw"></i>
        <i style="--x: 79%; --size: 7cqw; --delay: 120ms; --fall: 1.07s; --drift: -5cqw"></i>
        <i style="--x: 15%; --size: 12cqw; --delay: 195ms; --fall: 0.98s; --drift: 4cqw"></i>
        <i style="--x: 64%; --size: 8cqw; --delay: 250ms; --fall: 1.15s; --drift: 7cqw"></i>
        <i style="--x: 92%; --size: 6cqw; --delay: 310ms; --fall: 1.02s; --drift: -3cqw"></i>
        <i style="--x: 38%; --size: 10cqw; --delay: 345ms; --fall: 0.94s; --drift: -5cqw"></i>
        <i style="--x: 72%; --size: 12cqw; --delay: 410ms; --fall: 1.14s; --drift: 4cqw"></i>
        <i style="--x: 7%; --size: 7cqw; --delay: 460ms; --fall: 0.99s; --drift: 7cqw"></i>
        <i style="--x: 46%; --size: 6cqw; --delay: 520ms; --fall: 1.08s; --drift: -4cqw"></i>
        <i style="--x: 84%; --size: 9cqw; --delay: 580ms; --fall: 0.96s; --drift: -4cqw"></i>
      </div>
      <span class="loading-caption" aria-hidden="true">Ready to push...</span>
      <b class="loading-percent" aria-hidden="true">0%</b>
    </div>
  </div>
  <noscript>Enable JavaScript to play Jade Circuit.</noscript>
</body>
</html>
